{% extends "base.html" %}
{% block title %}{{ t('change_password') }} · {{ t('brand') }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-decoration" aria-hidden="true"></div>
  <div class="auth-card panel">
    <div class="auth-mark">{% include "_brand_mark.html" %}</div>
    <p class="eyebrow">{{ t('account') }}</p>
    <h1>{{ t('change_password_title') }}</h1>
    <p>{{ t('change_password_body') }}</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">
        <span>{{ t('current_password') }}</span>
        <input name="current_password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label class="field">
        <span>{{ t('new_password') }}</span>
        <input name="new_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
        <small class="field-help">{{ t('password_help') }}</small>
      </label>
      <label class="field">
        <span>{{ t('confirm_password') }}</span>
        <input name="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      </label>
      <button class="button button-primary button-block" type="submit">{{ t('change_password') }}</button>
    </form>
  </div>
</section>
{% endblock %}
