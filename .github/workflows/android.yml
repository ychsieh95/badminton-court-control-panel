name: Android

on:
  push:
    branches: [main]
    paths:
      - "Android/**"
      # The app's strings are generated from TRANSLATIONS in app.py.
      - "Web/app.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Android/**"
      - "Web/app.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - name: Check generated strings are up to date
        run: |
          python3 tools/gen_strings.py
          git diff --exit-code -- app/src/main/res/ || {
            echo "::error::strings.xml is out of date. Run 'python3 tools/gen_strings.py' in Android/ and commit the result."
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is not committed. Store it base64-encoded in the
      # GOOGLE_SERVICES_JSON repository secret (base64 -w0 app/google-services.json).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: Android/app/build/reports/tests/
          retention-days: 7
